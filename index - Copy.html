<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Insurance Estimator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-effects">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Insurance Estimator</h1>
            <p>Predict your medical costs instantly</p>
        </header>

        <main>
            <div class="glass-panel inputs-panel">
                <div class="form-group">
                    <label for="age">Age: <span id="ageValue">30</span> years</label>
                    <input type="range" id="age" min="18" max="100" value="30">
                </div>

                <div class="form-group">
                    <label for="bmi">BMI: <span id="bmiValue">25.0</span></label>
                    <input type="range" id="bmi" min="15" max="50" step="0.1" value="25.0">
                </div>
                
                <div class="form-group">
                    <label for="children">Children: <span id="childrenValue">0</span></label>
                    <input type="range" id="children" min="0" max="10" value="0">
                </div>

                <div class="form-group toggle-group">
                    <label>Smoker Status</label>
                    <label class="switch">
                        <input type="checkbox" id="smoker">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>

            <div class="glass-panel result-panel">
                <h2>Estimated Charge</h2>
                <div class="price-display">
                    <span class="currency">$</span>
                    <span class="amount" id="resultAmount">0.00</span>
                </div>
                <div class="details" id="calculationDetails">
                    Base: $2,000 + Age + BMI + Smoker + Children
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
